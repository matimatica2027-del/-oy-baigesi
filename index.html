<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ОЙ БӘЙГЕСІ — Интеллектуалды сайыс</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, sans-serif;
  background: #03071d;
  color: white;
}

body {
  overflow-x: hidden;
}

/* Басты сахна */

.stage {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
  overflow: hidden;
  background: #03071d;
}

/* Сурет толық көрінеді */

.stage-image {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 1;
}

/* Қозғалатын жарықтар */

.light {
  position: absolute;
  top: -30%;
  width: 18%;
  height: 120%;
  background: linear-gradient(
    to bottom,
    rgba(80,150,255,0.3),
    transparent
  );
  filter: blur(25px);
  transform-origin: top center;
  animation: moveLight 7s ease-in-out infinite alternate;
  pointer-events: none;
  z-index: 2;
}

.light.one {
  left: 20%;
}

.light.two {
  right: 20%;
  animation-delay: -3s;
}

@keyframes moveLight {
  from {
    transform: rotate(-18deg);
    opacity: 0.3;
  }
  to {
    transform: rotate(18deg);
    opacity: 0.7;
  }
}

/* Сурет үстіндегі батырмалар */

.hit-button {
  position: absolute;
  z-index: 5;
  border: none;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.hit-button:focus-visible {
  outline: 3px solid white;
  border-radius: 20px;
}

/* Бастау батырмасы */

.start-button {
  left: 28%;
  top: 79%;
  width: 44%;
  height: 12%;
}

/* Дыбыс батырмасы */

.sound-button {
  left: 16%;
  top: 80%;
  width: 9%;
  height: 10%;
}

/* Толық экран батырмасы */

.fullscreen-button {
  right: 16%;
  top: 80%;
  width: 9%;
  height: 10%;
}

/* Келесі бет */

.next-page {
  display: none;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 50px 20px;
  text-align: center;
  background:
    radial-gradient(circle at center, #173b91, #03071d 75%);
  flex-direction: column;
  justify-content: center;
  align-items: center;
  animation: fadeIn 0.8s ease;
}

.next-page h1 {
  color: #ffd65a;
  font-size: clamp(35px, 6vw, 75px);
  text-shadow: 0 0 25px #dca52a;
}

.next-page p {
  font-size: clamp(18px, 3vw, 28px);
  line-height: 1.6;
}

.next-page button {
  padding: 18px 35px;
  margin-top: 30px;
  border: 2px solid #ffe69a;
  border-radius: 30px;
  background: linear-gradient(135deg, #fff2a1, #e5a51b);
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.96);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
  }
}
</style>
</head>

<body>

<!-- БІРІНШІ БЕТ -->

<main class="stage" id="stage">

  <img
    class="stage-image"
    id="stageImage"
    src="FD926431-8450-4086-9DCE-3EC9F76F4F2B.png"
    alt="ОЙ БӘЙГЕСІ интеллектуалды сайысының сахнасы"
  >

  <div class="light one"></div>
  <div class="light two"></div>

  <button
    class="hit-button start-button"
    id="startButton"
    aria-label="Сайысты бастау">
  </button>

  <button
    class="hit-button sound-button"
    id="soundButton"
    aria-label="Дыбысты қосу немесе өшіру">
  </button>

  <button
    class="hit-button fullscreen-button"
    id="fullscreenButton"
    aria-label="Толық экран">
  </button>

</main>

<!-- ЕКІНШІ БЕТ -->

<section class="next-page" id="nextPage">

  <h1>🏆 ОЙ БӘЙГЕСІ</h1>

  <p>
    Қош келдіңіздер!
    <br>
    Алда сіздерді қызықты интеллектуалды сайыс күтеді!
  </p>

  <h2>🎯 3 ТОП • 5 ТУР • 100 СҰРАҚ</h2>

  <p>
    Келесі кезең — қызықты топқа бөліну!
  </p>

  <button id="backButton">
    ← БАСТЫ БЕТКЕ ҚАЙТУ
  </button>

</section>

<script>

const stage = document.getElementById("stage");
const nextPage = document.getElementById("nextPage");

const startButton = document.getElementById("startButton");
const soundButton = document.getElementById("soundButton");
const fullscreenButton = document.getElementById("fullscreenButton");
const backButton = document.getElementById("backButton");

let audioContext;
let soundEnabled = false;
let musicTimer;

/* Салтанатты әуен */

function playNote(frequency, duration, delay = 0) {
  if (!audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.value = frequency;

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  const now = audioContext.currentTime + delay;

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.08, now + 0.03);
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + duration
  );

  oscillator.start(now);
  oscillator.stop(now + duration + 0.02);
}

function playMusic() {
  if (!soundEnabled) return;

  const notes = [
    392, 494, 587, 784,
    587, 494, 659, 784
  ];

  notes.forEach((note, index) => {
    playNote(note, 0.35, index * 0.4);
  });
}

soundButton.addEventListener("click", async () => {
  if (!audioContext) {
    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();
  }

  await audioContext.resume();

  soundEnabled = !soundEnabled;

  soundButton.setAttribute(
    "aria-label",
    soundEnabled ? "Дыбысты өшіру" : "Дыбысты қосу"
  );

  clearInterval(musicTimer);

  if (soundEnabled) {
    playMusic();
    musicTimer = setInterval(playMusic, 3500);
  }
});

/* Сайысты бастау */

startButton.addEventListener("click", () => {
  if (soundEnabled) {
    playNote(523, 0.3);
    playNote(659, 0.3, 0.2);
    playNote(784, 0.6, 0.4);
  }

  stage.style.display = "none";
  nextPage.style.display = "flex";
});

/* Басты бетке қайту */

backButton.addEventListener("click", () => {
  nextPage.style.display = "none";
  stage.style.display = "block";
});

/* Толық экран */

fullscreenButton.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      } else {
        alert("Бұл браузерде толық экран режимі қолжетімсіз.");
      }
    } else {
      await document.exitFullscreen();
    }
  } catch (error) {
    alert("Толық экран режимін қосу мүмкін болмады.");
  }
});

/* Суреттің жүктелуін тексеру */

document.getElementById("stageImage")
  .addEventListener("error", () => {
    alert(
      "Сахна суреті табылмады. GitHub-та PNG файлының атауын тексеріңіз."
    );
  });

</script>

</body>
</html>
