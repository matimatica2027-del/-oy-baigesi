<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОЙ БӘЙГЕСІ | Интеллектуалды сайыс</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background:
    radial-gradient(ellipse at 50% 85%, #47317b 0%, transparent 55%),
    radial-gradient(ellipse at 50% 0%, #123a70 0%, transparent 60%),
    #050817;
}

.stage {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  padding: 35px 20px;
  isolation: isolate;
}

.stage::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: repeating-conic-gradient(
    from 0deg at 50% 100%,
    transparent 0deg 12deg,
    #ffd65a12 13deg 15deg,
    transparent 16deg 30deg
  );
  animation: lights 18s linear infinite;
}

@keyframes lights {
  to { transform: rotate(360deg); }
}

.crown {
  font-size: 85px;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 25px #ffcc44);
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

h1 {
  font-size: clamp(48px, 10vw, 110px);
  margin: 15px 0;
  font-weight: 900;
  letter-spacing: 4px;
  background: linear-gradient(
    #fff7bc,
    #ffd34d,
    #b87913
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 5px 15px #ffbb3360);
}

.subtitle {
  font-size: clamp(18px, 3vw, 30px);
  letter-spacing: 3px;
  color: #d9e8ff;
}

.welcome {
  font-size: clamp(20px, 4vw, 38px);
  margin-top: 35px;
  font-weight: bold;
}

.info {
  margin: 25px 0;
  padding: 15px 25px;
  border: 1px solid #e9bb6570;
  border-radius: 20px;
  background: #ffffff12;
  backdrop-filter: blur(10px);
  font-size: 19px;
}

.start-btn {
  margin-top: 25px;
  padding: 20px 55px;
  font-size: 25px;
  font-weight: bold;
  border: 2px solid #fff1a0;
  border-radius: 50px;
  color: #281500;
  background: linear-gradient(
    135deg,
    #fff4a1,
    #ffbf29,
    #d98b00
  );
  cursor: pointer;
  box-shadow: 0 0 35px #ffcc5580;
  animation: pulse 2s infinite;
}

.start-btn:hover {
  transform: scale(1.06);
}

@keyframes pulse {
  0%, 100% {
    box-shadow: 0 0 20px #ffcc5570;
  }
  50% {
    box-shadow: 0 0 55px #ffcc55;
  }
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: white;
  animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
  from { opacity: 0.1; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1.8); }
}

.footer {
  margin-top: 45px;
  color: #b9c6df;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<main class="stage">

  <div class="crown">🏆</div>

  <h1>ОЙ БӘЙГЕСІ</h1>

  <div class="subtitle">
    ИНТЕЛЛЕКТУАЛДЫ САЙЫС
  </div>

  <div class="welcome">
    ✨ Сайысқа қош келдіңіздер! ✨
  </div>

  <div class="info">
    👥 3 ТОП &nbsp; | &nbsp;
    🎯 5 ТУР &nbsp; | &nbsp;
    🧠 100 СҰРАҚ
  </div>

  <button class="start-btn" onclick="startGame()">
    ▶ САЙЫСТЫ БАСТАУ
  </button>

  <div class="footer">
    БІЛІМ • ТАПҚЫРЛЫҚ • ЖЕҢІС
  </div>

</main>

<script>
const stars = document.getElementById("stars");

for (let i = 0; i < 90; i++) {
  const star = document.createElement("span");
  star.className = "star";

  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.animationDelay = Math.random() * 3 + "s";

  stars.appendChild(star);
}

function startGame() {
  alert("🏆 ОЙ БӘЙГЕСІ басталады! Келесі кезеңде топқа бөліну жүйесін қосамыз.");
}
</script>

</body>
</html>
